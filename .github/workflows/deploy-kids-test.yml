name: 部署 kids 到测试服务器

on:
  push:
    branches: [test]
  workflow_dispatch:

# 同一时间只允许一个发布任务，避免两个版本交叉切换 current 软链接。
concurrency:
  group: deploy-kids-test
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-go-service.yml
    with:
      service_name: kids
      app_env: test
      health_url: http://127.0.0.1:18002/v1/health
      deployment_environment: test
    secrets: inherit

  contract-smoke:
    name: 验收 kids 测试环境合同
    needs: deploy
    runs-on: ubuntu-latest
    environment: test
    env:
      KIDS_DEPLOY_SMOKE_BASE_URL: ${{ vars.KIDS_DEPLOY_SMOKE_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 执行部署级合同 smoke
        run: |
          if [[ -z "$KIDS_DEPLOY_SMOKE_BASE_URL" ]]; then
            echo "请为 test GitHub Environment 配置 KIDS_DEPLOY_SMOKE_BASE_URL 变量。" >&2
            exit 1
          fi
          go test ./internal/api/kids/v1 -run 'TestV1Deployment(ValidationSmoke|TaskOccurrencesRejectsOversizedLimits)'
