# 在 acme.sh 已将证书安装至 /etc/nginx/ssl 后，使用本文件替换 HTTP 初始化配置。
server {
    listen 80;
    listen [::]:80;
    server_name apptest.rszai.com;

    # 保留 HTTP-01 路径，供证书自动续期校验使用。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 用于验证 Nginx 站点本身，避免占用 API 根路径。
    location = /_nginx {
        return 302 /_nginx/;
    }

    location = /_nginx/ {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apptest.rszai.com;

    ssl_certificate /etc/nginx/ssl/apptest.rszai.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/apptest.rszai.com.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 用于验证 Nginx 站点本身，避免占用 API 根路径。
    location = /_nginx {
        return 302 /_nginx/;
    }

    location = /_nginx/ {
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
    }

    location / {
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
